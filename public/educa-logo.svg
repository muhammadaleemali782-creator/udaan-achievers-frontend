<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B3B95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051D50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gold)" stroke-width="5" />
  <circle cx="100" cy="100" r="88" fill="url(#grad1)" />
  
  <!-- Inner Shield / Emblem -->
  <path d="M100 35 L145 55 V105 C145 135 100 160 100 160 C100 160 55 135 55 105 V55 Z" fill="#ffffff" opacity="0.1" />
  <path d="M100 45 L135 60 V100 C135 125 100 145 100 145 C100 145 65 125 65 100 V60 Z" fill="none" stroke="url(#gold)" stroke-width="3" />
  
  <!-- Letters EV -->
  <text x="100" y="105" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EV</text>
  
  <!-- Banner text below EV -->
  <text x="100" y="125" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="2">EDUCA</text>
  
  <!-- Laurel / Stars -->
  <circle cx="75" cy="72" r="3" fill="#FBBF24" />
  <circle cx="125" cy="72" r="3" fill="#FBBF24" />
</svg>