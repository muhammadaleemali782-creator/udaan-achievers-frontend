    <!-- Instant Zero-Flash Pre-render Visual Overrides -->
    <script>
      (function() {
        try {
          var rawOverrides = localStorage.getItem('educa_visual_overrides') || localStorage.getItem('lcc_visual_overrides');
          var overrides = rawOverrides ? JSON.parse(rawOverrides) : null;
          if (!overrides || Object.keys(overrides).length === 0) {
            var rawSets = localStorage.getItem('educa_website_settings') || localStorage.getItem('lcc_website_settings');
            if (rawSets) {
              var sets = JSON.parse(rawSets);
              overrides = sets.visualOverrides || null;
            }
          }
          if (overrides && typeof overrides === 'object') {
            var css = '';
            for (var key in overrides) {
              var item = overrides[key];
              if (!item) continue;
              var sel = item.selector || (key.indexOf('#') === 0 || key.indexOf('.') === 0 ? key : '');
              var rules = '';
              if (item.display === 'none' || item.isHidden) {
                rules += 'display: none !important; ';
              }
              if (item.backgroundColor) {
                rules += 'background-color: ' + item.backgroundColor + ' !important; ';
              }
              if (item.textColor) {
                rules += 'color: ' + item.textColor + ' !important; ';
              }
              if (item.borderColor) {
                rules += 'border-color: ' + item.borderColor + ' !important; ';
              }
              if (sel && rules) {
                css += sel + ' { ' + rules + ' }\n';
              }
            }
            if (css) {
              var style = document.createElement('style');
              style.id = 'educa-instant-theme-css';
              style.textContent = css;
              document.head.appendChild(style);
            }

            function applySingle(item) {
              if (!item) return;
              var el = null;
              if (item.selector) {
                try { el = document.querySelector(item.selector); } catch(e){}
              }
              if (!el && item.originalValue) {
                if (item.type === 'image') {
                  var imgs = document.querySelectorAll('img');
                  for (var i = 0; i < imgs.length; i++) {
                    if (imgs[i].src === item.originalValue || imgs[i].getAttribute('src') === item.originalValue) {
                      el = imgs[i]; break;
                    }
                  }
                } else {
                  var candidates = document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, a, button, li, div');
                  for (var j = 0; j < candidates.length; j++) {
                    if (candidates[j].textContent && candidates[j].textContent.trim() === item.originalValue.trim()) {
                      el = candidates[j]; break;
                    }
                  }
                }
              }
              if (el) {
                if (item.isHidden || item.display === 'none') {
                  el.style.display = 'none';
                }
                if (item.type === 'image' && item.value && el.src !== item.value) {
                  el.src = item.value;
                } else if (item.value && (item.type === 'text' || !item.type) && el.innerText !== item.value) {
                  el.innerText = item.value;
                }
                if (item.backgroundColor && el.style.backgroundColor !== item.backgroundColor) {
                  el.style.backgroundColor = item.backgroundColor;
                }
                if (item.textColor && el.style.color !== item.textColor) {
                  el.style.color = item.textColor;
                }
              }
            }

            function applyAll() {
              for (var k in overrides) {
                applySingle(overrides[k]);
              }
            }

            document.addEventListener('DOMContentLoaded', applyAll);
            window.addEventListener('load', function() { setTimeout(applyAll, 100); });
          }
        } catch (e) {}
      })();
    </script>
